[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grip"
version = "0.0.1"
description = "Local secure MCP resource gateway with thin cloud HTTPS APIs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "cryptography>=42.0.0",
  "keyring>=25.0.0",
  "mcp>=1.0.0",
  # Cloud inventory + metrics via signed HTTPS only (Aliyun / Tencent / Oracle / GCP)
  "paramiko>=3.4.0",
]

[project.optional-dependencies]
menubar = [
  "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
  "pyobjc-framework-WebKit>=10.0; sys_platform == 'darwin'",
  "pystray>=0.19.5; sys_platform == 'win32'",
  "pywebview>=5.0; sys_platform == 'win32'",
  "pillow>=10.0.0; sys_platform == 'win32'",
]
installer = [
  "pyinstaller>=6.0",
]
dev = ["pytest>=8.0.0"]

[project.scripts]
grip = "grip.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/grip"]

# Ship userspace wireguard-go binaries with the wheel.
[tool.hatch.build.targets.wheel.force-include]
"src/grip/tunnel/bins" = "grip/tunnel/bins"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
